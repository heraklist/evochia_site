# codemaestro-validation-template: phase2-basic
name: CodeMaestro Validation

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Validation suite to run.
        required: true
        type: choice
        options:
          - unit-tests
          - typecheck
          - dependency-audit
          - secrets-scan
          - security-baseline
          - ci-review

permissions:
  contents: read

jobs:
  validate:
    name: Validate ${{ inputs.suite }}
    runs-on: ubuntu-latest

    steps:
      - name: Validate suite input
        shell: bash
        env:
          REQUESTED_SUITE: ${{ inputs.suite }}
        run: |
          case "$REQUESTED_SUITE" in
            unit-tests|typecheck|dependency-audit|secrets-scan|security-baseline|ci-review)
              ;;
            *)
              echo "Unsupported validation suite: $REQUESTED_SUITE"
              exit 1
              ;;
          esac

      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.2"
          cache: npm

      - name: Install dependencies
        if: ${{ inputs.suite == 'unit-tests' || inputs.suite == 'typecheck' || inputs.suite == 'ci-review' }}
        run: npm ci --ignore-scripts

      - name: Run typechecks
        if: ${{ inputs.suite == 'typecheck' || inputs.suite == 'ci-review' }}
        run: |
          npm run typecheck
          npm run typecheck:gas

      - name: Run non-browser tests
        if: ${{ inputs.suite == 'unit-tests' || inputs.suite == 'ci-review' }}
        run: |
          npm run test:unit
          npm run test:analytics
          npm run seo:test:apps-script
          npm run seo:test:apps-script-contracts

      - name: Verify committed Apps Script bundles
        if: ${{ inputs.suite == 'ci-review' }}
        run: npm run seo:check:apps-script-bundle

      - name: Install Chromium
        if: ${{ inputs.suite == 'ci-review' }}
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        if: ${{ inputs.suite == 'ci-review' }}
        run: npm run test:e2e

      - name: Audit locked dependencies
        if: ${{ inputs.suite == 'dependency-audit' || inputs.suite == 'security-baseline' || inputs.suite == 'ci-review' }}
        run: npm run security:dependency-audit

      - name: Scan full Git history for secrets
        if: ${{ inputs.suite == 'secrets-scan' || inputs.suite == 'security-baseline' || inputs.suite == 'ci-review' }}
        run: bash scripts/security/secret-scan.sh
