name: SEO Data Hub Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - package.json
      - package-lock.json
      - tsconfig.json
      - seo/apps-script/**
      - seo/config/**
      - seo/schemas/**
      - tests/seo/**
      - sitemap.xml
      - en/privacy.html
      - el/privacy.html
      - .gitattributes
      - .gitignore
      - docs/seo/**
      - scripts/security/secret-scan.sh
      - .github/workflows/security-validation.yml
      - .github/workflows/codemaestro-validation.yml
      - .github/workflows/site-analytics-validation.yml
      - .github/workflows/browser-e2e-validation.yml
      - .github/workflows/seo-data-hub-validation.yml

permissions:
  contents: write

concurrency:
  group: seo-validation-${{ github.event.pull_request.number || github.ref }}-data-hub
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.2"
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Run root SEO contracts
        run: npm run test:unit

      - name: Run Apps Script unit tests
        run: npm run seo:test:apps-script

      - name: Build canonical Apps Script bundles for Task 5 handoff
        run: npm run seo:build:apps-script

      - name: Commit canonical Apps Script bundles to implementation branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git add seo/apps-script/generated seo/apps-script/generated-smoke
          if git diff --cached --quiet; then
            echo "Canonical generated artifacts already match."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(seo): regenerate canonical Apps Script bundles"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_HEAD_REF}"

      - name: Run Apps Script contract tests
        run: npm run seo:test:apps-script-contracts

      - name: Run TypeScript validation
        run: npm run typecheck

      - name: Run Apps Script TypeScript validation
        run: npm run typecheck:gas

      - name: Verify committed Apps Script bundles
        run: npm run seo:check:apps-script-bundle
