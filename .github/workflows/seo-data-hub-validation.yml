name: SEO Data Hub Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - package.json
      - package-lock.json
      - tsconfig.json
      - seo/apps-script/**
      - seo/config/**
      - seo/schemas/**
      - tests/seo/**
      - sitemap.xml
      - en/privacy.html
      - el/privacy.html
      - .gitattributes
      - .gitignore
      - docs/seo/**
      - scripts/security/secret-scan.sh
      - .github/workflows/security-validation.yml
      - .github/workflows/codemaestro-validation.yml
      - .github/workflows/site-analytics-validation.yml
      - .github/workflows/browser-e2e-validation.yml
      - .github/workflows/seo-data-hub-validation.yml

permissions:
  contents: write

concurrency:
  group: seo-validation-${{ github.event.pull_request.number || github.ref }}-data-hub
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out implementation branch for canonical generation
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: codex/evochia-seo-data-hub-v1
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.2"
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Generate and commit canonical Apps Script bundles
        run: |
          npm run seo:build:apps-script
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seo/apps-script/generated/Code.gs seo/apps-script/generated-smoke/Code.gs seo/apps-script/generated/appsscript.json seo/apps-script/generated-smoke/appsscript.json
          if git diff --cached --quiet; then
            echo "No generated bundle changes to commit."
          else
            git commit -m "build(seo): regenerate Apps Script bundles"
            git push origin HEAD:codex/evochia-seo-data-hub-v1
          fi
