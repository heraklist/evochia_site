name: SEO Page Integrity Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - en/**
      - el/**
      - middleware.ts
      - sitemap.xml
      - tests/seo/page-integrity.test.mjs
      - tests/seo/page-integrity-workflow-contract.test.mjs
      - package.json
      - package-lock.json
      - .github/workflows/page-integrity-validation.yml

permissions:
  contents: read

concurrency:
  group: seo-page-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.2"
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Run SEO page integrity contracts
        run: npm run test:unit
