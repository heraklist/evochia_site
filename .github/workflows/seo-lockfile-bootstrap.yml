name: SEO Lockfile Bootstrap

on:
  pull_request:
    branches:
      - main
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/seo-lockfile-bootstrap.yml

permissions:
  contents: write

concurrency:
  group: seo-system-writer
  cancel-in-progress: false

jobs:
  regenerate-lockfile:
    if: >-
      github.head_ref == 'seo-system' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out SEO branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: seo-system

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - name: Regenerate and verify lockfile
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
          npm run test:unit
          npm run seo:test:apps-script
          npm run typecheck

      - name: Verify only package-lock changed
        shell: bash
        run: |
          changed="$(git status --short)"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -vE '^\?\? package-lock\.json$|^ M package-lock\.json$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected generated changes:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

      - name: Commit verified lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build(seo): update verified npm lockfile"
          git push origin HEAD:seo-system
