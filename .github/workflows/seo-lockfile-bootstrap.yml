name: SEO Lockfile Bootstrap

on:
  pull_request:
    branches:
      - main
    paths:
      - package.json
      - package-lock.json
      - tsconfig.json
      - tests/seo/tooling.test.mjs
      - .github/workflows/seo-lockfile-bootstrap.yml

permissions:
  contents: read

concurrency:
  group: seo-validation-${{ github.event.pull_request.number || github.ref }}-lockfile
  cancel-in-progress: true

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - name: Generate lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify clean install from generated lockfile
        run: npm ci --ignore-scripts

      - name: Run tooling contract
        run: node --test tests/seo/tooling.test.mjs

      - name: Run TypeScript validation
        run: npm run typecheck

      - name: Upload generated lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: seo-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
