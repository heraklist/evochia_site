name: Apps Script Bundle Generation (Temporary)

on:
  pull_request:
    branches:
      - main
    paths:
      - package.json
      - package-lock.json
      - seo/apps-script/build.mjs
      - seo/apps-script/entrypoints/**
      - seo/apps-script/smoke/**
      - seo/apps-script/src/**
      - .github/workflows/apps-script-bundle-generation.yml

permissions:
  actions: read
  contents: write

jobs:
  stage-reviewed-blobs:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up canonical Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.2"

      - name: Download previously reviewed canonical artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --output reviewed-canonical.zip \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9018054543/zip"
          mkdir -p reviewed-canonical extracted-canonical
          unzip -q reviewed-canonical.zip -d reviewed-canonical
          tar -xf reviewed-canonical/apps-script-canonical.tar -C extracted-canonical

      - name: Verify reviewed bytes and create unreferenced Git blobs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          import path from 'node:path';

          const expected = {
            'package-lock.json': {
              sha256: '9e1345e2aea110edea73d9bfa485b621e5d9f0c7a248c3de479dc27a2b20d535',
              gitBlob: 'cb16e5fc29735abcbc886604fdbc2805d2b753fa',
            },
            'seo/apps-script/generated/Code.gs': {
              sha256: '4e8f52930c06404b1ecd3d5ae1fc41af047c6257bb61e4c003e74747abd34328',
              gitBlob: 'fa834f62742937010abd1f1e3f23577d037c2b51',
            },
            'seo/apps-script/generated/appsscript.json': {
              sha256: '6dab773b7367f88f23ba6b50e9730f1829be118b4fd294614ffe17de495d550a',
              gitBlob: '2a9aca8cab0f482dfbd134b5bad7eb5087050e9b',
            },
            'seo/apps-script/generated-smoke/Code.gs': {
              sha256: 'd1fec664cbd7b68f81282a43b2ceef4bbefc45479d72a0639e17e8c39ea827e5',
              gitBlob: 'f305b577bb62d18d386c44023d9e165fb337acf8',
            },
            'seo/apps-script/generated-smoke/appsscript.json': {
              sha256: 'a00647334dcbfbbee2393619a6b185aaa6e571b081b5f151d817636928520770',
              gitBlob: '32ae7ecd574255b9ae497dda5e736afaf3117758',
            },
          };

          const output = {};
          for (const [relativePath, hashes] of Object.entries(expected)) {
            const bytes = fs.readFileSync(path.join('extracted-canonical', relativePath));
            const sha256 = crypto.createHash('sha256').update(bytes).digest('hex');
            const gitBlob = crypto.createHash('sha1')
              .update(Buffer.from(`blob ${bytes.length}\0`))
              .update(bytes)
              .digest('hex');
            if (sha256 !== hashes.sha256 || gitBlob !== hashes.gitBlob) {
              throw new Error(`Reviewed artifact hash mismatch: ${relativePath}`);
            }

            const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/git/blobs`, {
              method: 'POST',
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
                'Content-Type': 'application/json',
                'X-GitHub-Api-Version': '2022-11-28',
              },
              body: JSON.stringify({ content: bytes.toString('base64'), encoding: 'base64' }),
            });
            if (!response.ok) {
              throw new Error(`Git blob upload failed for ${relativePath}: ${response.status} ${await response.text()}`);
            }
            const payload = await response.json();
            if (payload.sha !== hashes.gitBlob) {
              throw new Error(`GitHub returned unexpected blob SHA for ${relativePath}: ${payload.sha}`);
            }
            output[relativePath] = payload.sha;
          }

          fs.writeFileSync('blob-shas.json', `${JSON.stringify(output, null, 2)}\n`);
          NODE

      - name: Upload reviewed blob SHA manifest
        uses: actions/upload-artifact@v4.6.2
        with:
          name: apps-script-reviewed-blob-shas-${{ github.event.pull_request.head.sha }}
          path: blob-shas.json
          if-no-files-found: error
          retention-days: 3
