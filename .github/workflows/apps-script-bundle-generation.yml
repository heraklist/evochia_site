name: Apps Script Bundle Generation (Temporary)

on:
  pull_request:
    branches:
      - main
    paths:
      - package.json
      - package-lock.json
      - seo/apps-script/build.mjs
      - seo/apps-script/entrypoints/**
      - seo/apps-script/smoke/**
      - seo/apps-script/src/**
      - .github/workflows/apps-script-bundle-generation.yml

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up canonical Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.2"
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install existing locked dependencies
        run: npm ci --ignore-scripts

      - name: Add exact esbuild dependency in runner workspace
        run: npm install --save-dev --save-exact esbuild@0.25.9

      - name: Verify generated lockfile dependency shape
        run: |
          npm ls esbuild --depth=1
          node -e "const p=require('./package.json'); if(p.devDependencies.esbuild!=='0.25.9') process.exit(1)"

      - name: Build Apps Script artifacts
        run: node seo/apps-script/build.mjs

      - name: Package canonical generation output
        run: |
          tar -cf apps-script-canonical.tar \
            package.json \
            package-lock.json \
            seo/apps-script/generated \
            seo/apps-script/generated-smoke

      - name: Upload canonical generation output
        uses: actions/upload-artifact@v4.6.2
        with:
          name: apps-script-canonical-${{ github.sha }}
          path: apps-script-canonical.tar
          if-no-files-found: error
          retention-days: 3
